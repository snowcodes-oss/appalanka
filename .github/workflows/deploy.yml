name: Deploy

# Publie le site sur GitHub Pages à chaque push sur main.
#
# `configure-pages` renvoie l'URL réellement servie : aujourd'hui la « project
# page » https://snowcodes-oss.github.io/appalanka/, et automatiquement
# https://www.appalanka.fr/ le jour où le domaine personnalisé est déclaré dans
# Settings > Pages. Le build s'aligne dessus via SITE_URL / BASE_PATH, sans quoi
# tous les chemins absolus (/carte/, /_astro/…) pointent vers la racine du
# domaine et renvoient des 404.
#
# Attention : avec un déploiement par Actions, public/CNAME ne configure PAS le
# domaine — il se règle dans Settings > Pages (plus les enregistrements DNS).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; on ne coupe pas celui qui est en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        id: pages
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
