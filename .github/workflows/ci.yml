name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro check
      - run: npm run build
      - name: Lighthouse audit (mobile, all categories)
        run: |
          npx --yes @lhci/cli@0.15.x autorun
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
